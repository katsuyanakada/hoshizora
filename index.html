<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="ほしぞら">
<meta name="theme-color" content="#060a1c">
<title>ほしぞらナビ</title>
<style>
:root{
  color-scheme: dark;
  --sky:#060a1c; --sky2:#0d1733; --ink:#e9eefc; --ink2:#9fb0d8; --dim:#5d6a8f;
  --gold:#ffcf6b; --line:rgba(120,150,220,.42); --ground:#0b1410; --panel:rgba(14,20,44,.92);
  --edge:rgba(160,180,240,.18); --accent:#7fb2ff;
  --font:"Hiragino Maru Gothic ProN","Hiragino Maru Gothic Pro","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
}
html,body{height:100%;margin:0;background:var(--sky);color:var(--ink);font-family:var(--font);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
html.red{filter:grayscale(1) sepia(1) saturate(9) hue-rotate(-48deg) brightness(.72)}
[hidden]{display:none!important}
#sky{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
button,select,input{font-family:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

.top{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 8px) 12px 8px;
  display:flex;gap:8px;align-items:center;justify-content:space-between;pointer-events:none;
  background:linear-gradient(to bottom,rgba(6,10,28,.85),rgba(6,10,28,0))}
.top>*{pointer-events:auto}
.chip{border:1px solid var(--edge);background:rgba(14,20,44,.7);border-radius:999px;padding:7px 12px;font-size:13px;
  display:flex;align-items:center;gap:6px;line-height:1.2;white-space:nowrap;max-width:52vw;overflow:hidden;text-overflow:ellipsis}
.chip b{font-weight:700}
.chip small{color:var(--ink2);font-size:11px}
.time{font-variant-numeric:tabular-nums}
#redBtn{width:38px;height:38px;padding:0;justify-content:center;border-radius:50%;flex:none}
#redBtn span{width:14px;height:14px;border-radius:50%;background:#d33;display:block;box-shadow:0 0 8px #f33}

.banner{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 58px);
  background:rgba(255,207,107,.14);border:1px solid rgba(255,207,107,.4);color:#ffe3a6;font-size:12px;
  padding:6px 12px;border-radius:10px;max-width:calc(100vw - 32px);text-align:center;pointer-events:none}

.bar{position:fixed;left:0;right:0;bottom:0;padding:8px 10px calc(env(safe-area-inset-bottom,0px) + 10px);
  display:grid;grid-template-columns:repeat(5,1fr);gap:6px;background:linear-gradient(to top,rgba(6,10,28,.95) 60%,rgba(6,10,28,0))}
.bar button{background:none;border:0;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:4px;
  font-size:11px;color:var(--ink2);border-radius:12px}
.bar button svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.bar button[aria-pressed="true"]{color:var(--gold);background:rgba(255,207,107,.08)}

.sheet{position:fixed;left:8px;right:8px;bottom:calc(env(safe-area-inset-bottom,0px) + 72px);
  background:var(--panel);border:1px solid var(--edge);border-radius:18px;padding:14px 16px 16px;
  max-height:52vh;overflow:auto;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  box-shadow:0 10px 40px rgba(0,0,0,.5);max-width:520px;margin-inline:auto}
.sheet h2{margin:0 0 2px;font-size:20px;letter-spacing:.02em;text-wrap:balance}
.sheet h3{margin:0 0 10px;font-size:15px;color:var(--ink2);font-weight:700}
.sheet .sub{color:var(--ink2);font-size:12px;margin-bottom:10px}
.sheet p{margin:8px 0 0;font-size:14.5px;line-height:1.75}
.close{position:absolute;right:8px;top:8px;width:34px;height:34px;border-radius:50%;border:0;background:rgba(255,255,255,.06);font-size:18px;color:var(--ink2)}
.facts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{font-size:12px;border-radius:8px;padding:4px 8px;background:rgba(127,178,255,.12);color:#cfe0ff}
.tag.gold{background:rgba(255,207,107,.14);color:#ffe3a6}
.where{margin-top:10px;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.04);font-size:13.5px;line-height:1.7}
.where strong{color:var(--gold)}

.list{display:flex;flex-direction:column;gap:2px;margin:0;padding:0;list-style:none}
.list button{width:100%;text-align:left;background:none;border:0;border-bottom:1px solid rgba(255,255,255,.06);
  padding:10px 4px;display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;font-size:14.5px}
.list .dot{width:14px;height:14px;border-radius:50%;justify-self:center}
.list .dir{color:var(--ink2);font-size:12px;text-align:right;line-height:1.4}
.list .kind{display:block;color:var(--dim);font-size:11px}

.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
.row label{font-size:13px;color:var(--ink2);min-width:4.5em}
.btn{border:1px solid var(--edge);background:rgba(255,255,255,.05);border-radius:10px;padding:8px 12px;font-size:13px}
.btn.primary{background:var(--gold);color:#1a1405;border-color:var(--gold);font-weight:700}
select,input[type=date]{background:rgba(255,255,255,.06);border:1px solid var(--edge);border-radius:10px;padding:7px 8px;font-size:14px}
input[type=range]{width:100%;accent-color:var(--gold)}
.big-time{font-size:28px;font-variant-numeric:tabular-nums;font-weight:700;letter-spacing:.02em}
.toggle{display:flex;justify-content:space-between;align-items:center;padding:10px 2px;border-bottom:1px solid rgba(255,255,255,.06);font-size:14px}
.toggle input{width:20px;height:20px;accent-color:var(--gold)}
.note{font-size:12px;color:var(--ink2);line-height:1.7;margin-top:10px}
.guide{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 76px);max-width:520px;margin-inline:auto;
  display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid rgba(255,207,107,.5);border-radius:16px;padding:10px 10px 10px 14px;
  box-shadow:0 8px 30px rgba(0,0,0,.5)}
.guide .gt{flex:1;min-width:0;font-size:13px;line-height:1.5;color:var(--ink2)}
.guide .gt b{display:block;font-size:17px;color:var(--gold)}
.guide.found{border-color:#8fe3a8}.guide.found .gt b{color:#8fe3a8}
.guide .close{position:static;flex:none}
.search{width:100%;box-sizing:border-box;font-size:17px;padding:11px 14px;border-radius:12px;border:1px solid var(--edge);background:rgba(255,255,255,.07);-webkit-user-select:text;user-select:text}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px}
.chips button{border:1px solid var(--edge);background:rgba(255,255,255,.05);border-radius:999px;padding:6px 11px;font-size:13px}
.list button.below{opacity:.55}
.toast{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);background:var(--panel);border:1px solid var(--edge);
  padding:12px 16px;border-radius:14px;font-size:14px;line-height:1.6;max-width:calc(100vw - 48px);text-align:center;pointer-events:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head><body>


<canvas id="sky" aria-label="星空の地図"></canvas>

<div class="top">
  <button class="chip" id="placeBtn" aria-label="場所を変える"><small>場所</small><b id="placeName">東京</b></button>
  <button class="chip time" id="timeBtn" aria-label="時間を変える"><b id="timeLabel">--:--</b><small id="dateLabel"></small></button>
  <button class="chip" id="redBtn" aria-label="赤いライトモード" aria-pressed="false"><span></span></button>
</div>
<div class="banner" id="banner" hidden></div>
<div class="toast" id="toast" hidden></div>

<div class="sheet" id="sheet" hidden role="dialog"><button class="close" id="closeSheet" aria-label="とじる">×</button><div id="sheetBody"></div></div>

<div class="guide" id="guide" hidden><div class="gt" id="guideText"></div><button class="btn primary" id="guideAr" hidden>かざしてさがす</button><button class="close" id="guideClose" aria-label="さがすのをやめる">×</button></div>
<nav class="bar">
  <button id="arBtn" aria-pressed="false"><svg viewBox="0 0 24 24"><rect x="7" y="2.5" width="10" height="19" rx="2.2"/><path d="M10.5 18.5h3"/><path d="M12 6l1 2 2 .3-1.5 1.4.4 2.1-1.9-1-1.9 1 .4-2.1L9 8.3l2-.3z"/></svg>かざす</button>
  <button id="searchBtn"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg>さがす</button>
  <button id="tonightBtn"><svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/><path d="M17 3v3M15.5 4.5h3"/></svg>みどころ</button>
  <button id="nowBtn"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>いまの空</button>
  <button id="setBtn"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>表示</button>
</nav>

const norm360=x=>((x%360)+360)%360;

const EL={

 '地球':[1.00000261,0.00000562,0.01671123,-0.00004392,-0.00001531,-0.01294668,100.46457166,35999.37244981,102.93768193,0.32327364,0,0],
 '火星':[1.52371034,0.00001847,0.09339410,0.00007882,1.84969142,-0.00813131,-4.55343205,19140.30268499,-23.94362959,0.44441088,49.55953891,-0.29257343],

 '土星':[9.53667594,-0.00125060,0.05386179,-0.00050991,2.48599187,0.00193609,49.95424423,1222.49362201,92.59887831,-0.41897216,113.66242448,-0.28867794],

function helio(name,T){
  const e0=EL[name],a=e0[0]+e0[1]*T,e=e0[2]+e0[3]*T,I=(e0[4]+e0[5]*T)*D2R,L=e0[6]+e0[7]*T,wb=e0[8]+e0[9]*T,O=(e0[10]+e0[11]*T)*D2R;

  return [(cw*cO-sw*sO*cI)*xp+(-sw*cO-cw*sO*cI)*yp,(cw*sO+sw*cO*cI)*xp+(-sw*sO+cw*cO*cI)*yp,sw*sI*xp+cw*sI*yp];
}
function moonEcl(t){
  const d=jd(t)-2451543.5,s=x=>Math.sin(x*D2R);
  const N=125.1228-0.0529538083*d,i=5.1454,w=318.0634+0.1643573223*d,a=60.2666,e=0.0549,M=norm360(115.3654+13.0649929509*d);

      +0.046*s(2*Dm-Ms)+0.041*s(M-Ms)-0.035*s(Dm)-0.031*s(M+Ms)-0.015*s(2*F-2*Dm)+0.011*s(M-4*Dm);

const PCOL={'水星':'#c9c2b4','金星':'#fff6d8','火星':'#ff8a5c','木星':'#f3dcb0','土星':'#e8d59a'};
const PMAG={'水星':0,'金星':-4,'火星':0.5,'木星':-2.2,'土星':0.6};
function solarSystem(t){
  const T=(jd(t)-2451545)/36525,earth=helio('地球',T),out=[];
  const sunEcl=[-earth[0],-earth[1],-earth[2]];
  for(const n of ['水星','金星','火星','木星','土星']){
    const p=helio(n,T),g=[p[0]-earth[0],p[1]-earth[1],p[2]-earth[2]];
    out.push({type:'planet',name:n,eq:nrm(eclToEq(g)),mag:PMAG[n],color:PCOL[n],dist:Math.hypot(...g)});
  }
  const sunEq=nrm(eclToEq(sunEcl));
  const m=moonEcl(t),ml=m.lon*D2R,mb=m.lat*D2R;
  const moonEq=nrm(eclToEq([Math.cos(mb)*Math.cos(ml),Math.cos(mb)*Math.sin(ml),Math.sin(mb)]));

let cam=null;
function camera(){

let frame=null;
let cacheKey='',cacheFrame=null;

function drawMoon(p,rad,moon,sunH){
  const q=proj(nrm([moon.h[0]+(sunH[0]-moon.h[0])*0.02,moon.h[1]+(sunH[1]-moon.h[1])*0.02,moon.h[2]+(sunH[2]-moon.h[2])*0.02]));

  for(const p of pts){if(!p){first=true;continue}if(first){ctx.moveTo(p[0],p[1]);first=false}else ctx.lineTo(p[0],p[1])}ctx.stroke();
  for(let i=0;i<8;i++){const p=proj(enuVec(i*45,0));if(!onScreen(p,0))continue;

/* ---------- 位置・方角の説明 ---------- */
function dirText(v){const az=azOf(v),alt=altOf(v);return {dir:DIR16[Math.round(az/22.5)%16],d8:DIR8[Math.round(az/45)%8],alt,az}}
function heightText(alt){

  if(alt>80)return '<strong>ほぼ真上</strong>。頭の上を見上げよう';
  const fist=Math.round(alt/10*2)/2;
  return `地平線から <strong>${Math.round(alt)}°</strong>（うでをのばして、にぎりこぶし <strong>約${fist<1?'1':fist}こ分</strong>）の高さ`;

function riseHint(o){
  // 今夜いつ見やすいか: 18時〜翌6時で最も高くなる時刻
  const base=new Date(nowT());base.setHours(base.getHours()<12?-6:18,0,0,0);
  let best=null;for(let k=0;k<=48;k++){const t=base.getTime()+k*15*60000;const M=horizMatrix(t,S.lat,S.lon);
    let v;if(o.type==='planet'){const ss=solarSystem(t);v=mul(M,ss.planets.find(p=>p.name===o.name).eq)}
    else if(o.type==='moon'){v=mul(M,solarSystem(t).moon.eq)}
    else{const e=o.type==='star'?STAR_EQ[o.i]:o.type==='cons'?CONS_LIST.find(c=>c.id===o.id).eq:o.type==='dso'?o.eq:null;if(!e)return '';v=mul(M,e)}

  const d=new Date(best.t);return `今夜いちばん高くなるのは <strong>${d.getHours()}時${String(d.getMinutes()).padStart(2,'0')}分ごろ</strong>（高さ約${Math.round(best.a)}°）`;
}

function searchIndex(){

function flyTo(h){
  if(S.ar)return;const taz=azOf(h),talt=Math.max(-5,Math.min(85,altOf(h)));
  const a0=S.az,h0=S.alt;let da=((taz-a0+540)%360)-180;const t0=performance.now();

  const step=now=>{const k=reduce?1:Math.min(1,(now-t0)/700),e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
    S.az=norm360(a0+da*e);S.alt=h0+(talt-h0)*e;if(S.fov>140)S.fov=100;dirty=true;if(k<1)requestAnimationFrame(step);else saveView()};

function tonightList(){
  const F=frame=compute(),items=[];
  const add=(o,name,kind,col,h,score)=>{const a=altOf(h);if(a<3)return;const d=dirText(h);items.push({o,name,kind,col,dir:d.dir,alt:a,score})};
  add(F.moon,'月','月齢'+F.moon.age.toFixed(0),'#f6efd6',F.moon.h,100);
  for(const p of F.planets)add(p,p.name,'惑星',p.color,p.h,90-p.mag);
  for(const a of ASTERISMS){if(a.curve)continue;const vs=a.stars.map(n=>F.stars[byName[n]]);if(vs.every(v=>altOf(v)>8))add({type:'asterism',name:a.name},a.name,'星のならび','#ffcf6b',objH({type:'asterism',name:a.name}),70)}
  if(S.lat>5)add({type:'star',i:byName['北極星']},'北極星','北の目じるし','#fff6ec',F.stars[byName['北極星']],65);
  STARS.forEach((s,i)=>{if(s[2]<1.6&&s[4]&&s[4]!=='北極星')add({type:'star',i},s[4],magWord(s[2]).replace(/（.*/,'')+'・'+consName(s[5]),bvColor(s[3]),F.stars[i],50-s[2])});
  for(const o of DSO_EQ)add(o,o.name,o.kind,'#c8d7ff',F.toH(o.eq),40);
  items.sort((a,b)=>b.score-a.score);
  const sunAlt=altOf(F.sun),d=new Date(F.t);
  openSheet('tonight',`<h3>${d.getMonth()+1}月${d.getDate()}日 ${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')} に見えるもの</h3>
    ${sunAlt>-6?'<div class="note" style="margin-top:0">まだ明るい時間です。下の「時間」で夜にすると、夜空で見えるものに変わります。</div>':''}
    <ul class="list">${items.map((it,k)=>`<li><button data-k="${k}"><span class="dot" style="background:${it.col}"></span><span>${it.name}<span class="kind">${it.kind}</span></span><span class="dir">${it.dir}<br>高さ${Math.round(it.alt)}°</span></button></li>`).join('')}</ul>`);
  $('sheetBody').querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{const it=items[+b.dataset.k];showInfo(it.o);flyTo(objH(it.o))});
}

function timeSheet(){
  const t=new Date(nowT());
  const day=new Date(t);day.setHours(12,0,0,0);if(t.getHours()<12)day.setDate(day.getDate()-1);
  const mins=Math.round((t-day)/60000);
  const pad=n=>String(n).padStart(2,'0');
  const ds=`${t.getFullYear()}-${pad(t.getMonth()+1)}-${pad(t.getDate())}`;
  openSheet('time',`<h3>時間を変えてみよう</h3>
    <div class="big-time" id="tBig"></div>
    <input type="range" id="tRange" min="0" max="1439" step="5" value="${mins}" aria-label="時刻">
    <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--ink2)"><span>昼12時</span><span>夕方6時</span><span>夜12時</span><span>朝6時</span><span>昼12時</span></div>
    <div class="row"><label for="tDate">日にち</label><input type="date" id="tDate" value="${ds}"></div>
    <div class="row"><button class="btn" data-h="-1">−1時間</button><button class="btn" data-h="1">＋1時間</button><button class="btn" data-d="30">1か月後</button><button class="btn primary" id="tNow">いまに戻す</button></div>
    <p class="note">時間を進めると、星が東からのぼって西へしずんでいくようすがわかります。季節を変えると見える星座も変わるよ。</p>`);
  const upd=()=>{const d=new Date(nowT());$('tBig').textContent=`${d.getMonth()+1}月${d.getDate()}日 ${d.getHours()}:${pad(d.getMinutes())}`;updateTop();dirty=true};
  $('tRange').oninput=e=>{const base=new Date(day);S.fixedT=base.getTime()+(+e.target.value)*60000;upd()};
  $('tDate').onchange=e=>{const [y,m,dd]=e.target.value.split('-').map(Number);if(!y)return;const cur=new Date(nowT());const n=new Date(y,m-1,dd,cur.getHours(),cur.getMinutes());S.fixedT=n.getTime();timeSheet()};
  $('sheetBody').querySelectorAll('[data-h]').forEach(b=>b.onclick=()=>{S.fixedT=nowT()+(+b.dataset.h)*3600000;timeSheet()});
  $('sheetBody').querySelector('[data-d]').onclick=()=>{S.fixedT=nowT()+30*86400000;timeSheet()};
  $('tNow').onclick=()=>{S.fixedT=null;timeSheet()};
  upd();
}

function placeSheet(){
  openSheet('place',`<h3>見ている場所</h3>
    <div class="row"><button class="btn primary" id="gpsBtn">GPSで現在地をつかう</button></div>
    <div class="note" id="gpsMsg">いま：${S.place}（北緯${S.lat.toFixed(2)}°・東経${S.lon.toFixed(2)}°）${S.placeSrc==='gps'?' GPS':''}</div>
    <div class="row"><label for="citySel">都市から</label><select id="citySel"><option value="">えらぶ…</option>${CITIES.map((c,i)=>`<option value="${i}">${c[0]}</option>`).join('')}</select></div>
    <p class="note">星の見え方は場所によって少しずつちがいます。日本の中なら、近い都市をえらんでもほとんど同じに見えます。</p>`);
  $('gpsBtn').onclick=()=>locate(true);
  $('citySel').onchange=e=>{const c=CITIES[+e.target.value];if(!c)return;setPlace(c[1],c[2],c[0],'city');placeSheet()};
}
function setPlace(lat,lon,name,src){S.lat=lat;S.lon=lon;S.place=name;S.placeSrc=src;store.set('place',{lat,lon,name,src});updateTop();dirty=true}
function nearestCity(lat,lon){let b=null;for(const c of CITIES){const d=Math.hypot(c[1]-lat,(c[2]-lon)*Math.cos(lat*D2R));if(!b||d<b.d)b={d,n:c[0]}}return b.d<0.6?b.n+'付近':'現在地'}
function locate(manual){
  if(!navigator.geolocation){if(manual)msgGps('この画面では位置情報が使えません。都市をえらんでください。');return}
  if(manual)msgGps('現在地をさがしています…');
  navigator.geolocation.getCurrentPosition(p=>{const {latitude:la,longitude:lo}=p.coords;setPlace(la,lo,nearestCity(la,lo),'gps');if(manual)placeSheet()},
    e=>{if(!manual)return;if(e.code===1){msgGps('');const m=$('gpsMsg');if(m)m.innerHTML=DENIED_HELP}
      else msgGps(e.code===3?'時間内に現在地が取れませんでした。空が見える場所でもう一度ためすか、都市をえらんでください。':'現在地が取れませんでした（'+e.code+'）。都市をえらんでください。')},
    {enableHighAccuracy:false,timeout:12000,maximumAge:600000});
}
const DENIED_HELP=`<strong style="color:var(--gold)">このページの位置情報がブロックされています。</strong>次の3か所を確認してね：<br>
① 設定 → プライバシーとセキュリティ → 位置情報サービス → いちばん下の方の<b>「Safari Webサイト」</b>→「このAppの使用中」<br>
② 設定 → アプリ → Safari → 「Webサイトの設定」の<b>「位置情報」</b>→「確認」か「許可」<br>
③ Safariでこのページを開き、アドレスバーの左のボタン（ぁあ／ページメニュー）→<b>「Webサイトの設定」</b>→位置情報→「許可」<br>
なおしたら、ページを読み込み直して、もう一度「GPSで現在地をつかう」をおしてね。`;
function msgGps(t){const m=$('gpsMsg');if(m)m.textContent=t}

function settingsSheet(){
  const T=[['lines','星座の線'],['cnames','星座の名前'],['names','星の名前'],['asterisms','夏の大三角などの目じるし線'],['milky','天の川'],['planets','惑星']];
  openSheet('set',`<h3>表示</h3>${T.map(([k,n])=>`<label class="toggle" for="sw_${k}">${n}<input type="checkbox" id="sw_${k}" ${S.show[k]?'checked':''}></label>`).join('')}
    <div class="row"><button class="btn" id="allSky">空全体を見る（星座早見盤）</button><button class="btn" id="southBtn">南を向く</button></div>
    <p class="note">指でドラッグすると見る方向が変わり、2本指でひろげると拡大できます。星や星座の名前をタップすると、くわしい説明が出ます。<br>右上の赤いボタンは「赤いライトモード」。暗さに慣れた目をまぶしくしないので、星を見るときにおすすめです。</p>`);
  T.forEach(([k])=>$('sw_'+k).onchange=e=>{S.show[k]=e.target.checked;store.set('show',S.show);dirty=true});
  $('allSky').onclick=()=>{stopAR();S.alt=90;S.az=180;S.fov=178;saveView();dirty=true};
  $('southBtn').onclick=()=>{stopAR();S.az=180;S.alt=35;S.fov=100;saveView();dirty=true};
}

/* ---------- 上のバー ---------- */
function updateTop(){
  const d=new Date(nowT());$('timeLabel').textContent=`${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}`;
  $('dateLabel').textContent=`${d.getMonth()+1}/${d.getDate()}${S.fixedT!=null?' ・時間を変更中':''}`;
  $('placeName').textContent=S.place;
}
$('placeBtn').onclick=placeSheet;$('timeBtn').onclick=timeSheet;
$('tonightBtn').onclick=()=>sheetKind==='tonight'?closeSheet():tonightList();
$('setBtn').onclick=()=>sheetKind==='set'?closeSheet():settingsSheet();
$('nowBtn').onclick=()=>{S.fixedT=null;updateTop();if(!S.ar){S.fov=Math.min(S.fov,110)}dirty=true;toast('いまの時刻の空にしました')};
$('redBtn').onclick=()=>{S.red=!S.red;document.documentElement.classList.toggle('red',S.red);$('redBtn').setAttribute('aria-pressed',String(S.red));store.set('red',S.red)};
$('redBtn').setAttribute('aria-pressed',String(S.red));
let toastT=0;function toast(t,ms=2200){const e=$('toast');e.textContent=t;e.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>e.hidden=true,ms)}

/* ---------- 操作（ドラッグ・ピンチ・タップ） ---------- */
const ptrs=new Map();let drag=null,pinch=null,moved=0;
function saveView(){store.set('az',S.az);store.set('alt',S.alt);store.set('fov',S.fov)}
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});moved=0;
  if(ptrs.size===1)drag={x:e.clientX,y:e.clientY};if(ptrs.size===2){const [a,b]=[...ptrs.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y),fov:S.fov};drag=null}});
cv.addEventListener('pointermove',e=>{if(!ptrs.has(e.pointerId))return;ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pinch&&ptrs.size===2){const [a,b]=[...ptrs.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);S.fov=Math.max(15,Math.min(178,pinch.fov*pinch.d/d));moved+=10;dirty=true;return}
  if(drag&&!S.ar){const dx=e.clientX-drag.x,dy=e.clientY-drag.y;moved+=Math.abs(dx)+Math.abs(dy);
    const k=S.fov/Math.min(W,H);S.az=norm360(S.az-dx*k);S.alt=Math.max(-20,Math.min(90,S.alt+dy*k));drag={x:e.clientX,y:e.clientY};dirty=true}
  else if(drag)moved+=Math.abs(e.clientX-drag.x)+Math.abs(e.clientY-drag.y)});
const up=e=>{const was=ptrs.has(e.pointerId);ptrs.delete(e.pointerId);if(!was)return;if(ptrs.size<2)pinch=null;
  if(ptrs.size===0){if(moved<8)tap(e.clientX,e.clientY);drag=null;saveView()}};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',e=>{ptrs.delete(e.pointerId);drag=null;pinch=null});
cv.addEventListener('wheel',e=>{e.preventDefault();S.fov=Math.max(15,Math.min(178,S.fov*Math.exp(e.deltaY*0.001)));dirty=true;saveView()},{passive:false});
function tap(x,y){
  let best=null;for(const h of hits){const d=Math.hypot(h.x-x,h.y-y);if(d>h.r)continue;const sc=d-h.pri*6;if(!best||sc<best.sc)best={sc,h}}
  if(best){const o=best.h.obj;showInfo(o.type==='planet'||o.type==='moon'?{type:o.type,name:o.name}:o)}
  else if(sheetKind==='info')closeSheet();
}

/* ---------- スマホをかざすモード ---------- */
let lastOri=0,compOff=null;
function declination(){return S.lon>122&&S.lon<150&&S.lat>20&&S.lat<47?-(4.5+(S.lat-26)*0.28):0}
function onOri(e){
  if(e.alpha==null)return;lastOri=performance.now();
  const hd=e.webkitCompassHeading;
  let alpha=e.alpha;
  if(hd!=null&&!isNaN(hd)){const trueHd=hd+declination();const off=norm360((360-trueHd)-e.alpha);
    if(compOff==null)compOff=off;else{let d=((off-compOff+540)%360)-180;compOff=norm360(compOff+d*0.08)}alpha=e.alpha+compOff}
  else if(e.absolute===true){alpha=e.alpha}
  const a=alpha*D2R,b=e.beta*D2R,g=e.gamma*D2R,cA=Math.cos(a),sA=Math.sin(a),cB=Math.cos(b),sB=Math.sin(b),cG=Math.cos(g),sG=Math.sin(g);
  const X=[cA*cG-sA*sB*sG,sA*cG+cA*sB*sG,-cB*sG],Y=[-sA*cB,cA*cB,sB],Z=[cA*sG+sA*sB*cG,sA*sG-cA*sB*cG,cB*cG];
  const ang=((screen.orientation&&screen.orientation.angle)||window.orientation||0)*D2R;
  const r=[Math.cos(ang)*X[0]+Math.sin(ang)*Y[0],Math.cos(ang)*X[1]+Math.sin(ang)*Y[1],Math.cos(ang)*X[2]+Math.sin(ang)*Y[2]];
  const u=[-Math.sin(ang)*X[0]+Math.cos(ang)*Y[0],-Math.sin(ang)*X[1]+Math.cos(ang)*Y[1],-Math.sin(ang)*X[2]+Math.cos(ang)*Y[2]];
  const f=[-Z[0],-Z[1],-Z[2]];
  if(S.basis){const mv=Math.acos(Math.max(-1,Math.min(1,dot(S.basis.f,f))))*R2D,k=Math.min(1,0.55+mv*0.35);const L=(p,q)=>nrm(p.map((x,i)=>x+(q[i]-x)*k));const nf=L(S.basis.f,f),nu0=L(S.basis.u,u);
    const nr=nrm(cross(nf,nu0)),nu=cross(nr,nf);S.basis={f:nf,u:nu,r:nr}}
  else S.basis={f,u,r};
  dirty=true;
}
let wake=null;
async function startAR(){
  try{
    if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function'){
      const r=await DeviceOrientationEvent.requestPermission();if(r!=='granted'){toast('センサーの使用が許可されませんでした。指でドラッグして見てね',3500);return}}
  }catch(err){toast('この画面ではスマホの向きセンサーが使えません。指でドラッグして見てね',3500);return}
  S.ar=true;S.basis=null;compOff=null;lastOri=0;if(S.fov>110)S.fov=80;
  addEventListener('deviceorientation',onOri);$('arBtn').setAttribute('aria-pressed','true');
  toast('スマホを見たい空に向けてね。方位が合わないときは、8の字にスマホを動かすと直ります',3500);
  try{wake=await navigator.wakeLock?.request('screen')}catch(e){}
  setTimeout(()=>{if(S.ar&&!lastOri){stopAR();toast('スマホの向きセンサーが反応しません。指でドラッグして見てね',3500)}},2000);
}
function stopAR(){if(!S.ar)return;S.ar=false;removeEventListener('deviceorientation',onOri);$('arBtn').setAttribute('aria-pressed','false');
  if(S.basis){S.az=azOf(S.basis.f);S.alt=Math.max(-20,Math.min(90,altOf(S.basis.f)))}S.basis=null;dirty=true;try{wake&&wake.release()}catch(e){}}
$('arBtn').onclick=()=>S.ar?stopAR():startAR();

/* ---------- ループ ---------- */
let lastMin=-1;
function loop(){
  const m=Math.floor(Date.now()/30000);if(m!==lastMin){lastMin=m;updateTop();if(S.fixedT==null)dirty=true}
  if(dirty)render();requestAnimationFrame(loop);
}
updateTop();
if(S.placeSrc==='gps')locate(false);
requestAnimationFrame(loop);
</script>

</body></html>
